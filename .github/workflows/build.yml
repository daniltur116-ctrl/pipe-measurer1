name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          automake libltdl-dev \
          wget
    
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer
        pip install cython
    
    - name: Build APK with verbose logging
      run: |
        buildozer android debug --verbose
      continue-on-error: true
    
    - name: Show build log if failed
      if: failure()
      run: |
        echo "========== BUILD FAILED =========="
        echo "Last 200 lines of buildozer log:"
        tail -n 200 .buildozer/logs/build.log 2>/dev/null || echo "Log file not found"
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pipe-measurer-apk
        path: bin/*.apk
        compression-level: 0
